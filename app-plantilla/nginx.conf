# Configuración del servidor web (nginx) que corre dentro del contenedor
server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    location / {
        index index.html;
        # Que el navegador no guarde la página en caché: así cada recarga muestra lo último desplegado
        add_header Cache-Control "no-store";
    }

    # "Health check": la nube (y nuestras pruebas) lo usan para saber si la app está viva
    location = /salud {
        default_type text/plain;
        return 200 "OK\n";
    }
}
