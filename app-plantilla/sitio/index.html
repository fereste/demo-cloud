<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Nube + DevOps</title>
  <style>
    /* ============================================================
       CAMBIAR ACÁ durante la demo: el color de fondo de la página
       Probar por ejemplo: #1e6fd9 (azul), #16a34a (verde), #dc2626 (rojo)
       ============================================================ */
    :root { --color-fondo: #1e6fd9; }

    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-fondo); color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    main { padding: 2rem; max-width: 46rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 1rem; }
    p  { font-size: 1.3rem; margin: .4rem 0; }
    .datos {
      margin-top: 2rem; display: inline-block; text-align: left;
      background: rgba(0,0,0,.25); border-radius: .75rem; padding: 1rem 1.5rem;
      font-family: Consolas, monospace; font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- CAMBIAR ACÁ durante la demo: el mensaje principal -->
    <h1>¡Hola desde la nube!</h1>

    <p>Virtualización de Hardware &middot; UNLaM</p>

    <div class="datos">
      Versión (build de Jenkins): <b>__VERSION__</b><br>
      Fecha del build: __FECHA__<br>
      Servido por la réplica: <b>__REPLICA__</b>
    </div>
  </main>
</body>
</html>
